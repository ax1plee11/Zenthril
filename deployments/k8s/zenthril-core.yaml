apiVersion: v1
kind: Namespace
metadata:
  name: zenthril
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zenthril-config
  namespace: zenthril
data:
  APP_ENV: production
  PUBLIC_BASE_URL: https://api.example.com
  CORS_ALLOWED_ORIGINS: https://app.example.com
  WS_ALLOWED_ORIGINS: https://app.example.com
  EVENT_BUS_DRIVER: kafka
  KAFKA_BROKERS: redpanda.zenthril.svc.cluster.local:9092
  REDIS_URL: redis://redis.zenthril.svc.cluster.local:6379
  SCYLLA_HOSTS: scylla.zenthril.svc.cluster.local:9042
  SCYLLA_KEYSPACE: zenthril_messages
  GATEWAY_MAX_CONNECTIONS: "50000"
  GATEWAY_READ_LIMIT_BYTES: "1048576"
  GATEWAY_WRITE_TIMEOUT: 10s
  GATEWAY_PONG_WAIT: 60s
  GATEWAY_PING_PERIOD: 45s
  GATEWAY_DRAIN_TIMEOUT: 45s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: zenthril
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  selector:
    matchLabels:
      app: zenthril-api
  template:
    metadata:
      labels:
        app: zenthril-api
    spec:
      terminationGracePeriodSeconds: 75
      containers:
        - name: api
          image: ghcr.io/ax1plee11/zenthril-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: zenthril-config
            - secretRef:
                name: zenthril-secrets
          env:
            - name: SERVICE_NAME
              value: zenthril-api
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HTTP_ADDR
              value: :8080
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - wget -q --spider --header "Authorization: Bearer ${OPERATIONAL_TOKEN}" http://127.0.0.1:8080/readyz
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - wget -q --spider --header "Authorization: Bearer ${OPERATIONAL_TOKEN}" http://127.0.0.1:8080/healthz
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: zenthril
spec:
  type: ClusterIP
  selector:
    app: zenthril-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: zenthril
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app: zenthril-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: zenthril
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 6
  maxReplicas: 40
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: zenthril
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zenthril-worker
  template:
    metadata:
      labels:
        app: zenthril-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/ax1plee11/zenthril-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: zenthril-config
            - secretRef:
                name: zenthril-secrets
          env:
            - name: SERVICE_NAME
              value: zenthril-worker
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: zenthril
  annotations:
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: zenthril_gateway
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com
      secretName: zenthril-api-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
