services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET: .
    environment:
      APP_ENV: production
      ENVIRONMENT: production
      SERVICE_NAME: zenthril-api
      HTTP_ADDR: :8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      OPERATIONAL_TOKEN: ${OPERATIONAL_TOKEN:?set OPERATIONAL_TOKEN}
      DB_URL: postgres://${POSTGRES_USER:-zenthril}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zenthril}?sslmode=disable
      REDIS_URL: redis://redis:6379
      EVENT_BUS_DRIVER: kafka
      KAFKA_BROKERS: redpanda:9092
      SCYLLA_HOSTS: scylla:9042
      SCYLLA_KEYSPACE: ${SCYLLA_KEYSPACE:-zenthril_messages}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-zenthril-media}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_USE_SSL: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:?set WS_ALLOWED_ORIGINS}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: "false"
      GATEWAY_MAX_CONNECTIONS: "50000"
      GATEWAY_ROLE: primary
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
      scylla:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header \"Authorization: Bearer $${OPERATIONAL_TOKEN}\" http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    # SECURITY: drop all capabilities, no-new-privileges.
    security_opt:
      - no-new-privileges:true
      - seccomp:seccomp-profile.json
    cap_drop:
      - ALL
    # SECURITY: resource limits prevent DoS.
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 512m
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET: ./cmd/worker
    environment:
      APP_ENV: production
      ENVIRONMENT: production
      SERVICE_NAME: zenthril-worker
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      OPERATIONAL_TOKEN: ${OPERATIONAL_TOKEN:?set OPERATIONAL_TOKEN}
      DB_URL: postgres://${POSTGRES_USER:-zenthril}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zenthril}?sslmode=disable
      REDIS_URL: redis://redis:6379
      EVENT_BUS_DRIVER: kafka
      KAFKA_BROKERS: redpanda:9092
      SCYLLA_HOSTS: scylla:9042
      SCYLLA_KEYSPACE: ${SCYLLA_KEYSPACE:-zenthril_messages}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
      scylla:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # SECURITY: read-only filesystem with tmpfs scratch space.
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zenthril}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zenthril}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-zenthril} -d $${POSTGRES_DB:-zenthril}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.2.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    restart: unless-stopped

  scylla:
    image: scylladb/scylla:6.1
    command: ["--smp", "1", "--memory", "1G", "--overprovisioned", "1"]
    volumes:
      - scylla-data:/var/lib/scylla
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9000:9000"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    command: ["--config=/etc/otel-collector-config.yaml"]
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    environment:
      CADDY_ADMIN: "off"
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
      OPERATIONAL_TOKEN: ${OPERATIONAL_TOKEN:?set OPERATIONAL_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  redpanda-data:
  scylla-data:
  minio-data:
  caddy-data:
  caddy-config:
