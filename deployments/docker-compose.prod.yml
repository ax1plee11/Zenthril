services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET: ./cmd/api
    environment:
      APP_ENV: production
      SERVICE_NAME: zenthril-api
      HTTP_ADDR: :8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      OPERATIONAL_TOKEN: ${OPERATIONAL_TOKEN:?set OPERATIONAL_TOKEN}
      DB_URL: postgres://${POSTGRES_USER:-zenthril}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zenthril}?sslmode=disable
      REDIS_URL: redis://redis:6379
      EVENT_BUS_DRIVER: kafka
      KAFKA_BROKERS: redpanda:9092
      SCYLLA_HOSTS: scylla:9042
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-zenthril-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:?set WS_ALLOWED_ORIGINS}
    depends_on:
      - postgres
      - redis
      - redpanda
      - scylla
    deploy:
      replicas: 3
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET: ./cmd/worker
    environment:
      APP_ENV: production
      SERVICE_NAME: zenthril-worker
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      OPERATIONAL_TOKEN: ${OPERATIONAL_TOKEN:?set OPERATIONAL_TOKEN}
      DB_URL: postgres://${POSTGRES_USER:-zenthril}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zenthril}?sslmode=disable
      REDIS_URL: redis://redis:6379
      EVENT_BUS_DRIVER: kafka
      KAFKA_BROKERS: redpanda:9092
      SCYLLA_HOSTS: scylla:9042
    depends_on:
      - postgres
      - redis
      - redpanda
      - scylla
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zenthril}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zenthril}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.2.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    restart: unless-stopped

  scylla:
    image: scylladb/scylla:6.1
    command: ["--smp", "1", "--memory", "1G", "--overprovisioned", "1"]
    volumes:
      - scylla-data:/var/lib/scylla
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  redpanda-data:
  scylla-data:
  minio-data:
  caddy-data:
  caddy-config:
