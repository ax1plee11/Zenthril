name: Build Desktop App

on:
  # Desktop builds are intentionally manual for alpha releases. They are slow,
  # platform-sensitive, and should not run every time v0.1.0-alpha is moved.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: ./client
        run: npm install

      - name: Build Tauri App
        working-directory: ./client
        run: npm run tauri build

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: zenthril-windows-installer
          path: |
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Portable Executable
        uses: actions/upload-artifact@v4
        with:
          name: zenthril-windows-portable
          path: client/src-tauri/target/release/zenthril.exe

  build-linux:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: ./client
        run: npm install

      - name: Build Tauri App
        working-directory: ./client
        run: npm run tauri build

      - name: Upload Linux Packages
        uses: actions/upload-artifact@v4
        with:
          name: zenthril-linux
          path: |
            client/src-tauri/target/release/bundle/deb/*.deb
            client/src-tauri/target/release/bundle/appimage/*.AppImage

  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: ./client
        run: npm install

      - name: Build Tauri App
        working-directory: ./client
        run: npm run tauri build

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: zenthril-macos
          path: |
            client/src-tauri/target/release/bundle/dmg/*.dmg
            client/src-tauri/target/release/bundle/macos/*.app
