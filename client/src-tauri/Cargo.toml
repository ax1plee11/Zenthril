[package]
name = "zenthril"
version = "0.1.0"
description = "Zenthril — secure E2E encrypted messenger"
authors = ["Zenthril Team"]
edition = "2021"

[lib]
name = "zenthril_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zenthril"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
