name: zenthril

services:
  postgres:
    image: postgres:16-alpine
    container_name: zenthril-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zenthril
      POSTGRES_PASSWORD: zenthril
      POSTGRES_DB: zenthril
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenthril"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zenthril-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: zenthril-backend
    restart: unless-stopped
    environment:
      DB_URL: postgres://zenthril@postgres:5432/zenthril?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: zenthril-dev-secret-key
      HTTP_ADDR: ":8080"
      ADMIN_USER_IDS: "1dde727d-fc45-4a70-82e4-37a5016ecb21"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
