name: zenthril

services:
  postgres:
    image: postgres:16-alpine
    container_name: zenthril-postgres
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zenthril}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-zenthril}
    # DB ports are intentionally not published. For local debugging with a DB client,
    # run: docker compose -f docker-compose.yml -f docker-compose.debug.yml up
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zenthril-redis
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    # DB ports are intentionally not published. For local debugging with a DB client,
    # run: docker compose -f docker-compose.yml -f docker-compose.debug.yml up
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: zenthril-backend
    restart: unless-stopped
    mem_limit: 1g
    cpus: "2.0"
    environment:
      DB_URL: postgres://${POSTGRES_USER:-zenthril}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-zenthril}?sslmode=require
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      HTTP_ADDR: ":8080"
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      OPERATIONAL_TOKEN: ${OPERATIONAL_TOKEN:?Set OPERATIONAL_TOKEN in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:?Set WS_ALLOWED_ORIGINS in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      EVENT_BUS_DRIVER: ${EVENT_BUS_DRIVER:-kafka}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # SECURITY: drop all capabilities, no-new-privileges, read-only root filesystem.
    security_opt:
      - no-new-privileges:true
      - seccomp:seccomp-profile.json
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    # ARCHITECTURE: structured logging with rotation.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        label: "zenthril-backend"
    networks:
      - zenthril-internal
    # SECURITY: resource limits prevent DoS.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 512m

volumes:
  postgres_data:
  redis_data:

networks:
  zenthril-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
