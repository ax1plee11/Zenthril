name: zenthril

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: zenthril-postgres
    restart: unless-stopped
    user: "999:999"
    mem_limit: 512m
    cpus: "0.75"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zenthril}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in secret manager}
      POSTGRES_DB: ${POSTGRES_DB:-zenthril}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zenthril-internal
    # Read-only root filesystem where possible
    read_only: true
    tmpfs:
      - /var/run/postgresql:noexec,nosuid,size=16m,uid=999,gid=999
      - /tmp:noexec,nosuid,size=100m
    # Drop all capabilities, add only what's needed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    container_name: zenthril-redis
    restart: unless-stopped
    user: "999:999"
    mem_limit: 256m
    cpus: "0.5"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in secret manager}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in secret manager}
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zenthril-internal
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: zenthril-backend
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 512m
    cpus: "1.0"
    environment:
      DB_URL: ${DB_URL:?Set DB_URL in secret manager}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in secret manager}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in secret manager}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      HTTP_ADDR: ":8080"
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      OPERATIONAL_TOKEN: ${OPERATIONAL_TOKEN:?Set OPERATIONAL_TOKEN in secret manager}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in production}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:?Set WS_ALLOWED_ORIGINS in production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in secret manager}
      FEDERATION_ENABLED: ${FEDERATION_ENABLED:-false}
      FEDERATION_TOKEN: ${FEDERATION_TOKEN:?Set FEDERATION_TOKEN when federation enabled}
      EVENT_BUS_DRIVER: ${EVENT_BUS_DRIVER:-memory}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --header='Authorization: Bearer $${OPERATIONAL_TOKEN}' http://127.0.0.1:8080/livez >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - zenthril-internal
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  neo4j:
    image: neo4j:2026.10.1
    container_name: verix-neo4j
    restart: unless-stopped
    user: "7474:7474"
    mem_limit: 1g
    cpus: "1.0"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in secret manager}"
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
    expose:
      - "7474"
      - "7687"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./knowledge-base/schema.cypher:/var/lib/neo4j/init/schema.cypher:ro
    networks:
      - zenthril-internal
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  zenthril-internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
